name: CI

on:
  push:
    branches: [master]
  # Deliberately unfiltered. `branches: [master]` meant a stacked PR — one targeting
  # another feature branch rather than master — got no CI at all, while still showing
  # green ticks from the Vercel checks. A green that means "a deployment succeeded"
  # and not "the tests passed" is worse than a red one. Measured on PR #92, 2026-08-16.
  #
  # Safe to widen because this workflow holds no secrets: every env value below is a
  # hardcoded test placeholder. Do NOT copy this trigger to monitors.yml, which reads
  # the live chain and must never be reachable from a pull request (CC-085).
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # CC-085. Nothing in CI looked at workflow files, so an empty expression pair
      # inside a run: comment reached master and silently disabled the invariant
      # monitors' schedule for seven hours — an invalid workflow does not run and fail,
      # it just stops (Lessons-Learned §25). The class of change most able to break
      # scheduled monitoring had no gate on it at all.
      #
      # Runs first: it needs nothing installed and is the cheapest check in the job.
      #
      # Pinned by version AND sha256, because this downloads a binary and executes it.
      # A marketplace action in the same slot would be a mutable dependency — a moved
      # tag is a silent code change in a job that checks out the repository. Bump both
      # values together; the checksum comes from the release's own checksums.txt.
      - name: Lint workflow files
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
          rm -f actionlint actionlint.tar.gz

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      # Offline, no dependencies — the script runs before `npm install` by design.
      # INDEX.md is generated, so a PR that edits an issue without regenerating leaves
      # master with a board that silently disagrees with the issue files. Two PRs adding
      # issues in parallel is the common way this happens.
      - name: Backlog index is current
        run: node scripts/backlog.mjs --check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Contracts (CC-082). Compile first: the ABI drift check and the Hardhat-side
      # typecheck both read artifacts/, and the contract tests need bytecode.
      - name: Compile contracts
        run: npm run compile

      - name: Type check (contracts)
        run: npm run typecheck:contracts

      # Fails if src/lib/contracts/*-abi.ts no longer matches the compiled contract.
      # A hand-edited or simply stale ABI is indistinguishable at runtime from a
      # contract that lacks the function — the call just reverts.
      - name: ABI matches bytecode
        run: npm run gen:abi -- --check

      - name: Test (contracts)
        run: npm run test:contracts

      # CC-085. Offline registry validation only — no network, no secrets. It fails when a
      # monitor script named in the schedule no longer exists, which would otherwise mean
      # the scheduled workflow quietly stops checking an invariant while still going green.
      # The monitors themselves run on a schedule (.github/workflows/monitors.yml), not
      # here: they read the live chain, and a PR must never be able to trigger that.
      - name: Invariant monitor registry
        run: npm run monitors:list

      - name: Test
        run: npm test
        env:
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          NEXT_PUBLIC_BASE_NETWORK: testnet
          NEXT_PUBLIC_USDC_ADDRESS: "0x036CbD53842c5426634e7929541eC2318f3dCF7e"

      - name: Build
        run: npm run build
        env:
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          NEXT_PUBLIC_BASE_NETWORK: testnet
          NEXT_PUBLIC_USDC_ADDRESS: "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
